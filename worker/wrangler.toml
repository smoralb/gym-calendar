name = "gym-calendar-ai"
main = "index.js"
compatibility_date = "2025-01-01"

# Workers AI. No lleva clave: el binding se autentica solo con la cuenta.
[ai]
binding = "AI"

# Rate limiting nativo. El endpoint es público (lo llama la web desde el
# navegador de cualquiera), así que sin esto una sola persona puede agotar la
# cuota diaria gratuita de Workers AI en una tarde.
#   limit  peticiones permitidas por IP dentro de `period`
#   period sólo admite 10 o 60 segundos
# Contador del gasto diario (ver PRESUPUESTO_GLOBAL en index.js). Es un Durable
# Object y no KV ni D1 a propósito: necesitamos incrementos exactos, y el DO
# viaja dentro del propio deploy sin tener que crear ningún recurso aparte.
[[durable_objects.bindings]]
name = "CONTADOR"
class_name = "Contador"

# Suscripciones a notificaciones push. Clase aparte y no una tabla mas dentro
# de Contador: son cosas distintas y mezclarlas haria ilegible el fichero.
[[durable_objects.bindings]]
name = "SUSCRIPCIONES"
class_name = "Suscripciones"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Contador"]

# Copias de seguridad de los datos de la app. Clase aparte por lo mismo: es
# otra cosa distinta y mezclarla con las suscripciones no ayudaria a nadie.
[[durable_objects.bindings]]
name = "COPIAS"
class_name = "Copias"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Suscripciones"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Copias"]

# Recordatorios de entrenamiento. Se dispara cada hora en punto (UTC) y dentro
# se mira a quien le toca segun SU hora local: los usuarios estan en zonas
# distintas, asi que un cron por hora concreta no serviria.
[triggers]
crons = ["0 * * * *"]

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
