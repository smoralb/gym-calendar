<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym Calendar — Rutina de Ejercicios</title>
  <meta name="description" content="Calendario de rutina de ejercicios 3 días/semana: Empuje, Tirón, Pierna. Horario configurable.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Open Graph -->
  <meta property="og:title" content="Gym Calendar">
  <meta property="og:description" content="Rutina de ejercicios 3 días/semana con calendario y seguimiento de progreso">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/icon-512.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- HEADER -->
    <header class="app-header">
      <div class="app-title">
        <svg class="logo" viewBox="0 0 32 32" width="32" height="32">
          <rect x="2" y="14" width="28" height="4" rx="2" fill="#e94560"/>
          <rect x="0" y="10" width="6" height="12" rx="2" fill="#0f3460"/>
          <rect x="26" y="10" width="6" height="12" rx="2" fill="#0f3460"/>
          <rect x="0" y="9" width="8" height="14" rx="3" fill="none" stroke="#e94560" stroke-width="0.8"/>
          <rect x="24" y="9" width="8" height="14" rx="3" fill="none" stroke="#e94560" stroke-width="0.8"/>
        </svg>
        <span>
          Gym Calendar
          <span class="subtitle" id="appSubtitle">3 días por semana</span>
          <span id="appVersion" class="app-version"></span>
        </span>
        <button id="profileBadge" class="profile-badge" aria-label="Cambiar perfil">S</button>
      </div>

      <!-- PROFILE SELECTOR MODAL -->
      <div id="profileModal" class="profile-modal hidden">
        <div class="profile-modal-overlay" id="profileModalOverlay"></div>
        <div class="profile-modal-sheet">
          <div class="profile-modal-head">
            <div class="profile-modal-title">Tus planes</div>
            <button id="planEditToggle" class="profile-modal-edit">✏️ Editar</button>
          </div>
          <!-- Los planes se pintan desde el registro (renderPlanOptions) -->
          <div class="profile-modal-options"></div>
          <button id="redoWizardBtn" class="profile-modal-action">
            <span class="profile-modal-action-icon">🎯</span>
            <span class="profile-modal-action-text">
              <span class="profile-modal-action-title">Cambiar mi objetivo</span>
              <span class="profile-modal-action-desc">Vuelve a responder las preguntas y genera otra rutina</span>
            </span>
          </button>
        </div>
      </div>
      <!-- TAB BAR -->
      <div class="tab-bar">
        <button class="tab-btn" data-tab="home">
          <span class="tab-icon">🏠</span>
          <span class="tab-label">Inicio</span>
        </button>
        <button class="tab-btn active" data-tab="rutina">
          <span class="tab-icon">🏋️</span>
          <span class="tab-label">Rutina</span>
        </button>
        <button class="tab-btn" data-tab="db">
          <span class="tab-icon">🔍</span>
          <span class="tab-label">Ejercicios</span>
        </button>
        <button class="tab-btn" data-tab="stats">
          <span class="tab-icon">📊</span>
          <span class="tab-label">Stats</span>
        </button>
      </div>
    </header>

    <!-- HOME VIEW -->
    <div class="home-view" id="homeView" style="display:none;">
      <div id="homeContent">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- RUTINA VIEW -->
    <div id="rutinaView">
      <!-- ROUTINE HEADER (today/rest indicator) -->
      <div class="routine-status" id="routineStatus">
        <!-- Rendered by JS -->
      </div>

      <!-- PROGRESS -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-header">
          <span id="progressLabel">0/0 ejercicios</span>
          <span id="progressText">0% completado</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- DAY VIEW -->
      <main class="day-view" id="dayView">
        <!-- Rendered by JS -->
      </main>
    </div>

    <!-- EXERCISE DATASET BROWSER -->
    <div class="db-view" id="dbView" style="display:none;">
      <div id="dbContent">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- STATS VIEW -->
    <div class="stats-view" id="statsView" style="display:none;">
      <div id="statsContent">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- TUTORIAL: RUTINA A MEDIDA -->
  <div id="wizardModal" class="wizard-modal hidden">
    <div class="wizard-modal-overlay" id="wizardModalOverlay"></div>
    <div class="wizard-modal-sheet">
      <button class="wizard-close" id="wizardClose" aria-label="Cerrar">✕</button>
      <div id="wizardBody">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- BOTON FLOTANTE: REPORTAR IDEA O ERROR -->
  <button id="feedbackFab" class="feedback-fab" aria-label="Reportar una idea o un error">
    <span class="feedback-fab-icon">💬</span>
  </button>

  <!-- MODAL: REPORTAR IDEA O ERROR -->
  <div id="feedbackModal" class="feedback-modal hidden">
    <div class="feedback-modal-overlay" id="feedbackModalOverlay"></div>
    <div class="feedback-modal-sheet">
      <button class="feedback-close" id="feedbackClose" aria-label="Cerrar">✕</button>
      <div class="feedback-title">¿Qué nos cuentas?</div>
      <div class="feedback-sub">Una idea para mejorar la app o un fallo que hayas visto.</div>
      <div class="feedback-types">
        <button class="feedback-type active" data-type="idea">
          <span class="feedback-type-icon">💡</span>
          <span class="feedback-type-label">Idea</span>
        </button>
        <button class="feedback-type" data-type="error">
          <span class="feedback-type-icon">🐛</span>
          <span class="feedback-type-label">Error</span>
        </button>
      </div>
      <textarea id="feedbackText" class="feedback-textarea" rows="5" maxlength="1000" placeholder="Escribe aquí lo que quieras contarnos…"></textarea>
      <div class="feedback-counter"><span id="feedbackCount">0</span>/1000</div>
      <button id="feedbackSend" class="feedback-send" disabled>Enviar</button>
    </div>
  </div>

  <!-- MODAL: NOVEDADES DE LA VERSIÓN -->
  <div id="whatsNewModal" class="whatsnew-modal hidden">
    <div class="whatsnew-modal-overlay" id="whatsNewModalOverlay"></div>
    <div class="whatsnew-modal-sheet">
      <button class="whatsnew-close" id="whatsNewClose" aria-label="Cerrar">✕</button>
      <div class="whatsnew-title">✨ Novedades</div>
      <div class="whatsnew-sub" id="whatsNewSub"></div>
      <ul class="whatsnew-list" id="whatsNewList"></ul>
      <button id="whatsNewOk" class="whatsnew-ok">Entendido</button>
    </div>
  </div>

  <!-- MODAL: ¿POR QUÉ ESTE ENTRENAMIENTO? -->
  <div id="whyModal" class="whatsnew-modal hidden">
    <div class="whatsnew-modal-overlay" id="whyModalOverlay"></div>
    <div class="whatsnew-modal-sheet why-sheet">
      <button class="whatsnew-close" id="whyClose" aria-label="Cerrar">✕</button>
      <div id="whyBody"></div>
      <button id="whyOk" class="whatsnew-ok">Entendido</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
